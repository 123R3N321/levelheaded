<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LevelHeaded</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>LevelHeaded</h1>
      <p class="tagline">No jump scares. Audible dialogue.</p>
    </header>
    <main>
      <label class="row">
        <span>Enabled everywhere</span>
        <input type="checkbox" id="global-toggle" />
      </label>
      <label class="row">
        <span>On <strong id="site-name">this site</strong></span>
        <input type="checkbox" id="site-toggle" />
      </label>
      <p class="hint" id="status-hint"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
